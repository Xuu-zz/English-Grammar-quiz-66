</style>
</head>

<div class="container">
  <div class="top">
    <div class="brand">

    <div class="wrong-list" id="wrongList"></div>

  </div>

  <div class="foot">

    做题记录只存在本机浏览器，换设备不自动同步。
  </div>
</div>

(function () {
  var state = { gi: 0, queue: [], pos: 0, ans: {} };
  var LS = 'yl6a_tpl_v1';

  var chipWrap = document.getElementById('chipWrap');
  var progressDom = document.getElementById('progressDom');
  var progressBar = document.getElementById('progressBar');
  var qmetaDom = document.getElementById('qmetaDom');
  var questionDom = document.getElementById('questionDom');
  var answerWrap = document.getElementById('answerWrap');
  var foldTrigger = document.getElementById('foldTrigger');
  var foldContent = document.getElementById('foldContent');
  var ansDom = document.getElementById('ansDom');
  var analysisDom = document.getElementById('analysisDom');
  var knowledgeDom = document.getElementById('knowledgeDom');
  var scoreDom = document.getElementById('scoreDom');
  var resultDom = document.getElementById('resultDom');
  var prevBtn = document.getElementById('prevBtn');
  var nextBtn = document.getElementById('nextBtn');
  var submitBtn = document.getElementById('submitBtn');
  var finishBtn = document.getElementById('finishBtn');

  function norm(s) {
    if (s === null || s === undefined) return '';
    var t = String(s).toLowerCase().trim();
    t = t.replace(/[，,；;\/、]/g, ';').replace(/\s*;\s*/g, ';');
    t = t.replace(/[.。!！?？]+$/g, '').replace(/\s+/g, ' ').replace(/’/g, "'");
    return t;
  }
  function isRight(item, val) {
    if (item.type === 'choice') return String(val).toUpperCase() === String(item.answer).toUpperCase();
    var acc = item.accept && item.accept.length ? item.accept : [item.answer];
    var n = norm(val);
    for (var i = 0; i < acc.length; i++) if (norm(acc[i]) === n) return true;
    return false;
  }
  function letter(i) { return String.fromCharCode(65 + i); }
  function group() { return QUIZ.groups[state.gi]; }
  function item() { return group().items[state.queue[state.pos]]; }
  function curKey() { return group().id + '#' + state.queue[state.pos]; }

  /* ---------- 进度存储 ---------- */
  function save() {
    try {
      var all = JSON.parse(localStorage.getItem(LS) || '{}');
      all[group().id] = { ans: state.ans, pos: state.pos };
      localStorage.setItem(LS, JSON.stringify(all));
    } catch (e) {}
  }
  function load(gid) {
    try {
      var all = JSON.parse(localStorage.getItem(LS) || '{}');
      return all[gid] || null;
    } catch (e) { return null; }
  }

  /* ---------- 顶部分组 ---------- */
  function renderChips() {
    chipWrap.innerHTML = '';
    QUIZ.groups.forEach(function (g, i) {
      var b = document.createElement('button');
      b.className = 'chip' + (i === state.gi ? ' on' : '');
      b.textContent = g.name;
      b.onclick = function () { switchGroup(i); };
      chipWrap.appendChild(b);
    });
  }

  function switchGroup(i) {
    state.gi = i;
    state.queue = group().items.map(function (_, k) { return k; });
    var saved = load(group().id);
    state.ans = saved && saved.ans ? saved.ans : {};
    state.pos = 0;
    resultDom.classList.remove('on');
    renderChips();
    render();
  }

  /* ---------- 渲染 ---------- */
  function render() {
    var g = group(), it = item(), key = curKey(), rec = state.ans[key];
    var total = state.queue.length;

    progressDom.textContent = (state.pos + 1) + ' / ' + total;
    progressBar.style.width = ((state.pos + 1) / total * 100) + '%';
    qmetaDom.textContent = g.name + ' · 第 ' + (state.pos + 1) + ' 题';

    var q = String(it.question || '').split('\n');
    questionDom.innerHTML = '';
    var main = document.createElement('div');
    main.textContent = q[0];
    questionDom.appendChild(main);
    for (var i = 1; i < q.length; i++) {
      var sp = document.createElement('span');
      sp.className = 'cn'; sp.textContent = q[i];
      questionDom.appendChild(sp);
    }

    answerWrap.innerHTML = '';
    submitBtn.style.display = 'none';

    if (it.type === 'choice') {
      Object.keys(it.options).forEach(function (L) {
        var d = document.createElement('div');
        d.className = 'opt-item';
        var lt = document.createElement('span'); lt.className = 'lt'; lt.textContent = L;
        var tx = document.createElement('span'); tx.className = 'tx'; tx.textContent = it.options[L];
        d.appendChild(lt); d.appendChild(tx);
        if (rec) {
          if (L === it.answer) d.classList.add('right');
          else if (L === rec.val) d.classList.add('wrong');
          d.style.cursor = 'default';
        } else {
          d.onclick = function () { pick(L); };
        }
        answerWrap.appendChild(d);
      });
    } else {
      var row = document.createElement('div');
      row.className = 'fill-row';
      var inp = document.createElement('input');
      inp.id = 'fillInput';
      inp.autocomplete = 'off'; inp.spellcheck = false;
      inp.placeholder = '填写横线上的内容';
      if (rec) { inp.value = rec.val; inp.disabled = true; inp.className = rec.ok ? 'ok' : 'bad'; }
      row.appendChild(inp);
      answerWrap.appendChild(row);
      var h = document.createElement('div');
      h.className = 'hint';
      h.textContent = '大小写、句末标点不严格扣分；多个空用分号隔开（inventor; inventions）。';
      answerWrap.appendChild(h);
      if (!rec) {
        submitBtn.style.display = 'inline-block';
        inp.onkeydown = function (e) { if (e.key === 'Enter') { e.preventDefault(); submitFill(); } };
      }
    }

    // 解析
    ansDom.textContent = it.type === 'choice'
      ? (it.answer + '. ' + it.options[it.answer])
      : it.answer;
    analysisDom.textContent = it.analysis || '';
    knowledgeDom.textContent = it.knowledge || '';
    var ft = document.getElementById('foldTitle');
    var fa = document.getElementById('foldArrow');
    if (rec) {
      ft.textContent = '查看解析 & 知识点';
      fa.textContent = '点开 / 收起';
      foldContent.classList.add('open');
    } else {
      ft.textContent = '作答后显示解析';
      fa.textContent = '先做题';
      foldContent.classList.remove('open');
    }

    prevBtn.disabled = state.pos === 0;
    nextBtn.textContent = state.pos + 1 >= total ? '已是最后一题' : '下一题';
    nextBtn.disabled = state.pos + 1 >= total;

    var done = 0, right = 0;
    state.queue.forEach(function (k) {
      var r = state.ans[g.id + '#' + k];
      if (r) { done++; if (r.ok) right++; }
    });
    scoreDom.textContent = done
      ? '已答 ' + done + ' / ' + total + ' 题，答对 ' + right + ' 题' + (done === total ? '　（可以交卷了）' : '')
      : '还没开始作答';
  }

  /* ---------- 作答 ---------- */
  function pick(L) {
    var it = item(), key = curKey();
    if (state.ans[key]) return;
    state.ans[key] = { val: L, ok: L === it.answer };
    save();
    render();
    if (!state.ans[key].ok) {
      // 答错时把解析展开，让人立刻看到为什么
      foldContent.classList.add('open');
    }
  }

  function submitFill() {
    var inp = document.getElementById('fillInput');
    if (!inp) return;
    var val = inp.value.trim();
    if (!val) { inp.focus(); return; }
    var it = item(), key = curKey();
    state.ans[key] = { val: val, ok: isRight(it, val) };
    save();
    render();
    if (!state.ans[key].ok) foldContent.classList.add('open');
  }

  /* ---------- 交卷 ---------- */
  function finish() {
    var g = group(), total = state.queue.length, done = 0, right = 0, wrongs = [];
    state.queue.forEach(function (k) {
      var r = state.ans[g.id + '#' + k];
      var it = g.items[k];
      if (r) { done++; if (r.ok) right++; else wrongs.push({ k: k, it: it }); }
    });
    document.getElementById('resultScore').textContent = right + ' / ' + total;
    document.getElementById('resultSub').textContent = done < total
      ? '还有 ' + (total - done) + ' 题没做，先做完再交卷更准。'
      : (right / total >= 0.9 ? '这一组可以过了，换下一组。' : (right / total >= 0.7 ? '把错的题重做一遍，再走。' : '先回知识点看一眼（首页「知识」页），再重做。'));
    var wl = document.getElementById('wrongList');
    wl.innerHTML = '';
    if (!wrongs.length) { wl.textContent = '没有错题。'; }
    else {
      wl.textContent = '错题：' + wrongs.map(function (w) {
        return '第 ' + (state.queue.indexOf(w.k) + 1) + ' 题（' + w.it.answer + '）';
      }).join('、');
    }
    resultDom.classList.add('on');
    resultDom.scrollIntoView({ block: 'nearest' });
  }

  function redoWrong() {
    var g = group(), wrongIdx = [];
    state.queue.forEach(function (k) {
      var r = state.ans[g.id + '#' + k];
      if (r && !r.ok) wrongIdx.push(k);
    });
    if (!wrongIdx.length) { return; }
    wrongIdx.forEach(function (k) { delete state.ans[g.id + '#' + k]; });
    state.queue = wrongIdx;
    state.pos = 0;
    resultDom.classList.remove('on');
    save();
    render();
  }

  function restart() {
    state.queue = group().items.map(function (_, k) { return k; });
    state.ans = {};
    state.pos = 0;
    resultDom.classList.remove('on');
    save();
    render();
  }

  /* ---------- 事件 ---------- */
  prevBtn.onclick = function () { if (state.pos > 0) { state.pos--; save(); render(); } };
  nextBtn.onclick = function () { if (state.pos + 1 < state.queue.length) { state.pos++; save(); render(); } };
  submitBtn.onclick = submitFill;
  finishBtn.onclick = finish;
  foldTrigger.onclick = function () {
    if (!state.ans[curKey()]) { return; }   // 没作答不开放解析，避免直接看答案
    foldContent.classList.toggle('open');
  };
  document.getElementById('redoWrongBtn').onclick = redoWrong;
  document.getElementById('restartBtn').onclick = restart;

  document.addEventListener('keydown', function (e) {
    if (e.key === 'ArrowRight') { if (!nextBtn.disabled) nextBtn.click(); }
    if (e.key === 'ArrowLeft') { if (!prevBtn.disabled) prevBtn.click(); }
  });

  switchGroup(0);
})();
</script>
</body>
