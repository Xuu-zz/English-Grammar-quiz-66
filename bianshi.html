<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#F7F3EC">
<title>译林六上 · 变式题工厂</title>
<style>
  :root{
    --paper:#F7F3EC;--card:#fff;--ink:#1A1713;--ink2:#544E45;--ink3:#8B8375;
    --line:#E7DFD2;--line2:#D8CFBF;--accent:#0C6A57;--accent-soft:#E7F1EE;
    --gold:#A06E22;--gold-soft:#F8EEDB;--ok:#177A4F;--ok-soft:#E7F3EC;--bad:#AE3524;--bad-soft:#FAEAE6;
    --en:"Iowan Old Style",Palatino,Georgia,"Times New Roman",serif;
    --zh:"PingFang SC","Microsoft YaHei",system-ui,sans-serif;
  }
  *{box-sizing:border-box}
  body{margin:0;background:var(--paper);color:var(--ink);font-family:var(--zh);font-size:16px;line-height:1.6;
    -webkit-font-smoothing:antialiased;-webkit-text-size-adjust:100%;padding:0 14px 92px}
  .app{max-width:720px;margin:0 auto}
  header{position:sticky;top:0;z-index:10;background:var(--paper);padding:12px 0 8px;border-bottom:1px solid var(--line);
    display:flex;justify-content:space-between;align-items:flex-end;gap:10px}
  .kick{font-size:10.5px;letter-spacing:.14em;color:var(--ink3)}
  h1{margin:2px 0 0;font-size:18px}
  h1 small{font-size:11.5px;font-weight:400;color:var(--ink3);margin-left:5px}
  .stat{font-size:11.5px;color:var(--ink3);text-align:right;white-space:nowrap}
  .stat b{font-family:var(--en);font-size:16px;color:var(--accent)}
  h2.sec{font-size:12px;letter-spacing:.08em;color:var(--ink3);font-weight:600;margin:22px 0 8px}
  .panel{background:var(--card);border:1px solid var(--line);border-radius:14px;padding:14px}
  .panel+.panel{margin-top:10px}
  .rows{background:var(--card);border:1px solid var(--line);border-radius:14px;overflow:hidden}
  .row{display:flex;align-items:center;gap:12px;width:100%;padding:12px 13px;background:none;border:0;
    border-bottom:1px solid var(--line);text-align:left;cursor:pointer}
  .row:last-child{border-bottom:0}
  .row:hover{background:#FBF8F2}
  .row .idx{font-family:var(--en);font-size:16px;font-weight:600;color:var(--accent);width:34px;flex:0 0 auto}
  .row .mid{flex:1;min-width:0}
  .row .t{font-weight:600;font-size:15px;display:block}
  .row .s{font-size:12px;color:var(--ink3);display:block;margin-top:1px}
  .row .arrow{color:var(--ink3);font-size:17px}
  .meter{height:3px;background:var(--line);border-radius:2px;margin-top:6px;overflow:hidden}
  .meter i{display:block;height:100%;background:var(--accent)}
  .btn{display:inline-flex;align-items:center;justify-content:center;min-height:44px;padding:0 16px;border-radius:11px;
    border:1px solid var(--accent);background:var(--accent);color:#fff;font-weight:600;font-size:15px;cursor:pointer}
  .btn.ghost{background:var(--card);color:var(--accent);border-color:var(--line2)}
  .btn.sm{min-height:36px;padding:0 12px;font-size:13.5px;border-radius:9px}
  .btn.block{width:100%}
  .btnrow{display:flex;gap:8px;flex-wrap:wrap}
  .chips{display:flex;gap:6px;overflow-x:auto;padding:10px 0 2px;scrollbar-width:none}
  .chips::-webkit-scrollbar{display:none}
  .chip{flex:0 0 auto;border:1px solid var(--line2);background:var(--card);color:var(--ink2);border-radius:999px;
    padding:6px 11px;font-size:12.5px;cursor:pointer}
  .chip.on{background:var(--accent);border-color:var(--accent);color:#fff;font-weight:600}
  .qbar{height:3px;background:var(--line);border-radius:2px;margin:12px 0 6px;overflow:hidden}
  .qbar i{display:block;height:100%;background:var(--accent);transition:width .2s}
  .qmeta{display:flex;justify-content:space-between;font-size:11.5px;color:var(--ink3);margin:8px 0 12px}
  .qmeta .tag{color:var(--gold)}
  .stem{font-family:var(--en);font-size:18.5px;line-height:1.7;white-space:pre-wrap;margin:0 0 14px}
  .stem .cn{display:block;font-family:var(--zh);font-size:13px;color:var(--ink3);margin-top:4px}
  .opts{display:flex;flex-direction:column;gap:7px}
  .opt{display:flex;gap:11px;align-items:flex-start;width:100%;text-align:left;background:var(--card);
    border:1px solid var(--line2);border-radius:11px;padding:10px 12px;min-height:46px;cursor:pointer;font-size:16px}
  .opt .lt{font-family:var(--en);font-weight:600;width:22px;height:22px;flex:0 0 auto;border:1px solid var(--line2);
    border-radius:5px;display:flex;align-items:center;justify-content:center;font-size:13px;color:var(--ink2);margin-top:1px}
  .opt .tx{font-family:var(--en);font-size:16.5px;line-height:1.5}
  .opt.sel{border-color:var(--accent);background:var(--accent-soft)}
  .opt.sel .lt{background:var(--accent);border-color:var(--accent);color:#fff}
  .opt.ok{border-color:var(--ok);background:var(--ok-soft)}
  .opt.ok .lt{background:var(--ok);border-color:var(--ok);color:#fff}
  .opt.bad{border-color:var(--bad);background:var(--bad-soft)}
  .opt.bad .lt{background:var(--bad);border-color:var(--bad);color:#fff}
  .field{margin-top:12px}
  .field input,.field textarea{width:100%;font-family:var(--en);font-size:17px;padding:10px 12px;
    border:1px solid var(--line2);border-radius:11px;background:var(--card);color:var(--ink)}
  .field textarea{min-height:70px;resize:vertical}
  .field input:focus,.field textarea:focus{outline:2px solid var(--accent-soft);border-color:var(--accent)}
  .hint{font-size:11.5px;color:var(--ink3);margin-top:5px}
  .fb{border:1px solid var(--line);border-radius:14px;background:var(--card);margin-top:16px;overflow:hidden}
  .fb .h{padding:10px 13px;font-weight:700;font-size:14px;display:flex;justify-content:space-between;gap:8px}
  .fb.ok .h{background:var(--ok-soft);color:var(--ok)}
  .fb.bad .h{background:var(--bad-soft);color:var(--bad)}
  .fb .b{padding:4px 13px 13px}
  .kv{display:grid;grid-template-columns:46px 1fr;gap:8px;padding:7px 0;border-bottom:1px dashed var(--line);font-size:14px}
  .kv:last-child{border-bottom:0}
  .kv .k{color:var(--ink3);font-size:12px}
  .kv .v{color:var(--ink2);line-height:1.65}
  .kv .v.en{font-family:var(--en);font-size:15.5px;color:var(--ink)}
  .know{margin-top:10px;border:1px solid var(--line);border-radius:11px;background:#FCFAF5;overflow:hidden}
  .know .kh{padding:9px 12px;font-size:13px;font-weight:700;color:var(--gold);display:flex;justify-content:space-between;cursor:pointer}
  .know .kb{padding:0 12px 12px;font-size:13.5px;color:var(--ink2);display:none;line-height:1.7}
  .know.open .kb{display:block}
  .know .f{font-family:var(--en);font-size:14.5px;color:var(--accent);display:block;margin-bottom:4px}
  .know .e{font-family:var(--en);font-size:14px;color:var(--ink);display:block;margin-bottom:6px}
  .acts{display:flex;gap:8px;margin-top:12px;flex-wrap:wrap}
  .res{text-align:center;padding:22px 14px}
  .res .big{font-family:var(--en);font-size:38px;font-weight:700;letter-spacing:.02em}
  .res .sub{font-size:13px;color:var(--ink3);margin-top:4px}
  .taglist{display:flex;flex-wrap:wrap;gap:6px;margin-top:10px}
  .tg{font-size:12px;padding:4px 9px;border-radius:999px;background:var(--card);border:1px solid var(--line2);color:var(--ink2)}
  .tg.bad{border-color:#E7C3B9;background:var(--bad-soft);color:var(--bad)}
  .empty{text-align:center;padding:32px 16px;color:var(--ink3)}
  nav{position:fixed;left:0;right:0;bottom:0;background:rgba(247,243,236,.98);border-top:1px solid var(--line2);
    padding:5px 6px calc(5px + env(safe-area-inset-bottom));display:flex;max-width:720px;margin:0 auto;z-index:20}
  nav button{flex:1;background:none;border:0;padding:7px 2px;font-size:11px;color:var(--ink3);display:flex;
    flex-direction:column;align-items:center;gap:2px;min-height:48px}
  nav button .g{font-size:16px;line-height:1}
  nav button[aria-current="true"]{color:var(--accent);font-weight:600}
  .toast{position:fixed;left:50%;bottom:80px;transform:translateX(-50%);background:#1A1713;color:#fff;padding:8px 15px;
    border-radius:999px;font-size:13px;z-index:99}
  footer{margin-top:26px;padding-top:12px;border-top:1px solid var(--line);font-size:11.5px;color:var(--ink3);line-height:1.75}
  @media(max-width:420px){.stem{font-size:17.5px}body{padding:0 11px 88px}}
  @media print{nav,header,.btn,.btnrow,.acts,.qbar,.chips{display:none!important}body{padding:0;background:#fff}}
  @media (prefers-reduced-motion:reduce){*{transition:none!important}}
</style>
</head>
<body>
<div class="app">
  <header>
    <div>
      <div class="kick">译林版（三起）· 六年级上册 · 变式训练</div>
      <h1>变式题工厂<small>U1–U8 · 18 类考点</small></h1>
    </div>
    <div class="stat" id="topStat"></div>
  </header>
  <main id="view"></main>
</div>
<nav id="nav">
  <button data-nav="home" aria-current="true"><span class="g">✎</span>练</button>
  <button data-nav="map"><span class="g">⌘</span>考点</button>
  <button data-nav="errors"><span class="g">✓</span>错题</button>
  <button data-nav="teach"><span class="g">师</span>讲评</button>
</nav>
<script>
/* 译林版（三起）六年级上册 2026 秋 · 单元知识库
   来源标注：
   full  = 教材+教师资料包（U2/U3，最准）
   test  = 公开单元卷/课件（U1/U4/U5）
   theme = 按单元主题与教参整理（U6/U7/U8，词汇请以课本词汇表为准） */
const UNITS = [
{
  id: 'u1', no: 'U1', title: 'Try your best', cn: '全力以赴', theme: '梦想与职业', src: 'test',
  words: [
    ['pilot','n.','飞行员'],['doctor','n.','医生'],['nurse','n.','护士'],['writer','n.','作家'],
    ['singer','n.','歌手'],['dancer','n.','舞蹈演员'],['player','n.','运动员；选手'],['farmer','n.','农民'],
    ['driver','n.','司机'],['policeman','n.','警察（复 policemen）'],['cook','n./v.','厨师；烹饪'],
    ['worker','n.','工人'],['dream','n.','梦想'],['future','n.','未来'],['best','adj./adv.','最好的'],
    ['hard','adv./adj.','努力地；困难的'],['plane','n.','飞机'],['sick','adj.','生病的'],['hospital','n.','医院']
  ],
  phrases: [
    ['try one\'s best','尽某人最大努力'],['be good at doing sth','擅长做某事'],['have a try','试一试'],
    ['want to be','想要成为'],['make one\'s dream come true','让梦想成真'],['work hard','努力工作/学习'],
    ['help sick people','帮助生病的人'],['in the future','在未来'],['give up','放弃'],['of course','当然']
  ],
  patterns: [
    {en:'What do you want to be? — I want to be a pilot.', cn:'你想成为什么？——我想当飞行员。', note:'问职业理想，答 want to be + a/an + 职业'},
    {en:'What does your father do? — He is a doctor.', cn:'你爸爸做什么工作？——他是医生。', note:'问职业两种问法：What do you do? / What do you want to be?'},
    {en:'She is good at drawing.', cn:'她擅长画画。', note:'at 是介词，后面动词加 -ing'},
    {en:'You should try your best.', cn:'你应该尽最大努力。', note:'should + 动词原形，表建议'},
    {en:'Then you can make your dream come true.', cn:'那样你就能让梦想成真。', note:'make + 宾语 + 形容词/动词原形'}
  ],
  grammar: [
    {t:'be good at + 动词-ing', f:'主语 + be good at + doing', eg:'He is good at swimming.', warn:'at 是介词 → 动词必须 -ing（× good at draw）'},
    {t:'want to be + 职业', f:'主语 + want to be + a/an + 职业名词', eg:'I want to be a writer.', warn:'元音音素前用 an：an artist / an engineer'},
    {t:'职业名词后缀', f:'动词/名词 + -er/-or/-ist', eg:'teach→teacher, write→writer, sing→singer, dance→dancer, play→player, drive→driver, farm→farmer', warn:'policeman 复数是 policemen；cook 既是动词也是“厨师”'},
    {t:'should + 动词原形', f:'主语 + should + 动词原形', eg:'You should study hard.', warn:'should 后永远原形，不加 to、不加 -s'},
    {t:'一般过去时（复习）', f:'主语 + 动词过去式', eg:'He asked me for help.', warn:'U1 已开始出现过去时叙述，为 U2 做铺垫'}
  ],
  traps: [
    'be good at draw × → be good at drawing √',
    'I want to be pilot. × → I want to be a pilot. √',
    'He should to try his best. × → He should try his best. √',
    'make my dream come true（come 不加 comes）',
    'policeman 的复数是 policemen，不是 policemans'
  ]
},
{
  id: 'u2', no: 'U2', title: 'Honesty', cn: '诚实', theme: '诚实与勇气', src: 'full',
  words: [
    ['honesty','n.','诚实；正直'],['honest','adj.','诚实的'],['lie','n./v.','谎言；说谎'],
    ['truth','n.','真相；事实'],['storybook','n.','故事书'],['diary','n.','日记'],['entry','n.','（日记的）一则'],
    ['repair','v.','修理；修补'],['break','v.','弄坏；打破'],['careful','adj.','小心的；仔细的'],
    ['carefully','adv.','认真地；仔细地'],['whose','pron.','谁的'],['schoolbag','n.','书包'],
    ['fun','n.','乐趣（不可数）'],['important','adj.','重要的'],['feel','v.','感觉'],['mistake','n.','错误']
  ],
  phrases: [
    ['tell a lie / tell lies','说谎'],['tell the truth','说真话'],['on one\'s way home','在某人回家的路上'],
    ['give sth to sb','把某物给某人'],['begin to do sth','开始做某事'],['try to do sth','努力/试图做某事'],
    ['try one\'s best','尽某人最大努力'],['want to do sth','想要做某事'],['say sorry to sb','向某人道歉'],
    ['feel good','感觉（心情）好'],['walk to + 地点','步行去某地'],['look at sth','看着某物'],
    ['be honest with sb','对某人诚实'],['make a mistake','犯错']
  ],
  patterns: [
    {en:'Whose book is this? — It\'s Bobby\'s.', cn:'这是谁的书？——是博比的。', note:'whose + 名词 + be + this/that；答语可用名词所有格或 mine/yours'},
    {en:'I can give it to Mrs Fox tomorrow.', cn:'我明天可以把它给狐狸太太。', note:'give + 代词 + to + sb；代词 it/them 不能放中间'},
    {en:'Sam began to read the book. It was great fun.', cn:'萨姆开始读这本书。太有趣了。', note:'fun 不可数，不说 a great fun'},
    {en:'Oh no, I broke it!', cn:'哦不，我把它弄坏了！', note:'break–broke–broken'},
    {en:'Did you see my storybook yesterday? — No, I didn\'t.', cn:'你昨天看见我的故事书了吗？——没有。', note:'Did 问必须 did/didn\'t 答，这是本单元最大失分点'},
    {en:'Sam did not feel good.', cn:'萨姆心情不好。', note:'did not + 动词原形（× didn\'t felt）'},
    {en:'It was not easy, but he tried his best.', cn:'这不容易，但他尽了最大努力。', note:'but 连接转折，写作高分句'},
    {en:'It is important to be honest.', cn:'诚实很重要。', note:'It is + adj + to do sth，it 是形式主语'},
    {en:'Honesty is important.', cn:'诚实很重要。', note:'抽象名词作主语，谓语用单数 is'},
    {en:'Why should you be honest? — Because …', cn:'你为什么要诚实？——因为……', note:'Why 问，Because 答；should 后原形'}
  ],
  grammar: [
    {t:'一般过去时 · 四种句式', f:'肯定：主语+过去式 ／ 否定：主语+didn\'t+原形 ／ 一般疑问：Did+主语+原形? ／ 特殊疑问：疑问词+did+主语+原形?', eg:'Sam broke the book. / Sam didn\'t break the book. / Did Sam break the book? / When did Sam break the book?', warn:'did/didn\'t 后面一定回原形；be 动词的过去式不加 did'},
    {t:'规则动词 -ed 四条加法', f:'一般 +ed ／ 以 e 结尾 +d ／ 辅音+y 变 y 为 i +ed ／ 重读闭音节双写 +ed', eg:'walk→walked, like→liked, try→tried, stop→stopped', warn:'studied 不是 studyed；stopped 双写 p'},
    {t:'过去时间标志词', f:'yesterday / last week / … ago / one day / just now / in 1930 / at that time', eg:'He found it on his way home yesterday.', warn:'看到这些词先判断时态，再动笔'},
    {t:'名词性物主代词', f:'mine / yours / his / hers / its / ours / theirs', eg:'It\'s mine. = It\'s my book.', warn:'名词性物主代词后面不能再加名词（× mine book）'},
    {t:'抽象名词作主语', f:'Honesty / Happiness / Friendship + is …', eg:'Honesty is important.', warn:'不能用 are'}
  ],
  traps: [
    'No, I don\'t. ×（回答 Did you…?）→ No, I didn\'t. √',
    'He didn\'t broke it. × → He didn\'t break it. √',
    'It was a great fun. × → It was great fun. √',
    'I can give Mrs Fox it. × → I can give it to Mrs Fox. √',
    'He tried his bestly. × → He tried his best. √',
    'Honesty are important. × → Honesty is important. √',
    'in my way home × → on my way home √',
    'He repaired the book careful. × → carefully √',
    'Why should you to be honest? × → Why should you be honest? √',
    'It is important be honest. × → It is important to be honest. √'
  ]
},
{
  id: 'u3', no: 'U3', title: 'Great people', cn: '伟人', theme: '人物与贡献', src: 'full',
  words: [
    ['great','adj.','伟大的；杰出的'],['people','n.','人们（本身是复数）'],['teach','v.','教（taught）'],
    ['poet','n.','诗人'],['poem','n.','诗'],['nurse','n.','护士'],['sick','adj.','生病的'],
    ['scientist','n.','科学家'],['prize','n.','奖；奖品'],['musician','n.','音乐家'],['inventor','n.','发明家'],
    ['develop','v.','培育；发展'],['hybrid','adj.','杂交的'],['feed','v.','喂养；养活（fed）'],
    ['field','n.','田地；领域'],['dream','n./v.','梦想'],['hero','n.','英雄（heroes）'],
    ['paper','n.','纸（不可数）'],['cheap','adj.','便宜的'],['dear','adj.','昂贵的（=expensive）'],
    ['silk','n.','丝绸'],['bamboo','n.','竹子'],['country','n.','国家（countries）'],['difficult','adj.','困难的']
  ],
  phrases: [
    ['stop doing sth','停止做某事'],['stop to do sth','停下来去做另一件事'],['make sb/sth + adj.','使……变得……'],
    ['make sb do sth','让某人做某事'],['the answer to …','……的答案'],['try to do sth','努力做某事'],
    ['try doing sth','试着做某事（看效果）'],['help sb (to) do sth','帮助某人做某事'],['in one\'s own way','以某人自己的方式'],
    ['want to do = would like to do','想要做某事'],['do sth for sb','替某人做某事'],['ask sb to do sth','让某人做某事'],
    ['talk / think about sth','谈论/思考某事'],['take sb to + 地点','带某人去某地'],['thanks for doing sth','感谢你做某事'],
    ['be happy/glad/sorry to do sth','做某事很高兴/抱歉'],['be famous for / as','因……而著名 / 作为……而著名'],
    ['do the shopping/cleaning','购物/打扫'],['be born in / on','出生于'],['at the age of + 数字','在……岁时'],
    ['work on sth','致力于；从事'],['come true','实现'],['give up (doing) sth','放弃（做）某事'],
    ['keep doing sth','一直做某事'],['enjoy doing sth','喜欢做某事'],['see sb do sth','看见某人做某事（全过程）'],
    ['see sb doing sth','看见某人正在做某事'],['grow up','长大'],['pass away','去世（委婉）'],
    ['do studies on sth','对……进行研究'],['be like','像……'],['learn from sb','向某人学习']
  ],
  patterns: [

  GENS.ordinal = {

  GENS.whose = {

    label: '对划线部分提问', tag: 'transform_ask', desc: 'Who / When / Why / How + did', unit: 'u3',
    mk: function (r) {
      var modes = [
        { src: 'Yuan Longping was a Chinese rice scientist.', focus: 'Yuan Longping', ans: 'Who was a Chinese rice scientist?', why: '划线部分指人且原句是 be 动词 → Who + was + 其他，语序不变。' },
        { src: 'His dreams came true because he never gave up.', focus: 'because he never gave up', ans: 'Why did his dreams come true?', why: '问原因用 Why；原句是实义动词 came，加 did 并把 came 还原为 come。' },
        { src: 'He developed hybrid rice in 1973.', focus: 'in 1973', ans: 'When did he develop hybrid rice?', why: '问时间用 When；did 后接动词原形 develop。' },
        { src: 'He worked hard to make his dream come true.', focus: 'to make his dream come true', ans: 'Why did he work hard?', why: '问目的/原因用 Why，加 did 后 work 还原为原形。' },
        { src: 'Cai Lun made paper with cheap things.', focus: 'with cheap things', ans: 'How did Cai Lun make paper?', why: '问“用什么方式”用 How。' },
        { src: 'Sam broke the book last week.', focus: 'last week', ans: 'When did Sam break the book?', why: '问时间用 When；did 后 break 用原形。' }
      ];
      var m = pick(r, modes);
      return {
        stem: '对划线部分提问（' + m.focus + '）：\n' + m.src,
        answer: m.ans, accept: [m.ans, m.ans.replace(/\?$/, ''), m.ans.replace(/^Why/, 'why')],
        point: '过去时特殊疑问句改写',
        why: m.why + ' 口诀：疑问词 + did + 主语 + 动词原形。',
        level: 3
      };
    }
  };

  GENS.phrase_fill = {
    label: '固定搭配填空', tag: 'phrase_fill', desc: '汉译英常考短语', unit: 'u3',
    mk: function (r) {
      var frames = [
        { p: 'learn from', s: 'What can you ______ great people?', cn: '你能从伟人身上学到什么？', why: 'learn from sb 向某人学习。' },
        { p: 'at the age of', s: 'He began to work on the farm ______ six.', cn: '他六岁时就开始干农活。', why: 'at the age of + 数字 = when he was … years old。' },
        { p: 'famous for', s: 'She is ______ helping others.', cn: '她因为帮助别人而闻名。', why: 'be famous for + 特点/原因；be famous as + 身份。' },
        { p: 'give up', s: 'Don\'t ______ and keep working hard!', cn: '不要放弃，继续努力！', why: '祈使句否定 Don\'t + 动词原形；give up 放弃。' },
        { p: 'take part in', s: 'Why don\'t you ______ the school play?', cn: '你为什么不参加学校的话剧？', why: 'Why don\'t you + 动词原形，表建议；take part in 参加。' },
        { p: 'look after', s: 'We should ______ old people.', cn: '我们应该照顾老人。', why: 'look after = take care of 照顾。' },
        { p: 'on my way home', s: 'I found the book ______ .', cn: '我在回家的路上找到了这本书。', why: 'on one\'s way home 在某人回家的路上，home 前不加 to。' },
        { p: 'instead of', s: 'We can walk ______ taking a car.', cn: '我们可以走路而不是坐车。', why: 'instead of + 名词/doing，of 是介词。' },
        { p: 'used to', s: 'People ______ write letters, but now they send emails.', cn: '人们过去写信，现在发邮件。', why: 'used to + 动词原形，表过去常常。' },
        { p: 'come true', s: 'If you never give up, your dream will ______ .', cn: '如果你永不放弃，梦想就会实现。', why: 'come true 实现，主语是梦想。' }
      ];
      var f = pick(r, frames);
      return {
        stem: '根据汉语完成句子（每空一词）：\n' + f.cn + '\n' + f.s,
        answer: f.p, point: '固定搭配', why: f.why, level: 2
      };
    }
  };

  GENS.turn_into = {
    label: 'turn into / make out of', tag: 'turn_into', desc: 'U7 旧物改造的两个介词', unit: 'u7',
    mk: function (r) {
      var modes = [
        { s: 'We can turn an old bottle ______ a vase.', o: ['into', 'in', 'out of', 'for'], a: 'A', why: 'turn A into B 把 A 变成 B。' },
        { s: 'My mum made a bag ______ old clothes.', o: ['into', 'out of', 'from', 'with'], a: 'B', why: 'make B out of A 用 A 做成 B。' },
        { s: 'First we cut the box ______ small pieces.', o: ['into', 'out of', 'on', 'at'], a: 'A', why: 'cut … into … 把……剪成……。' },
        { s: 'Old things can have a new ______ .', o: ['life', 'live', 'living', 'lives'], a: 'A', why: 'have a new life 获得新生命，life 是名词。' }
      ];
      var m = pick(r, modes);
      return { stem: m.s, options: m.o, answer: m.a, point: 'U7 固定搭配', why: m.why, level: 2 };
    }
  };

  var ORDER = ['past_form', 'past_neg', 'past_yesno', 'be_past', 'wh_word', 'word_family', 'verb_pattern',
    'plural', 'ordinal', 'prep_time', 'sva', 'continuous', 'tense_signal', 'whose', 'transform_neg',
    'transform_ask', 'phrase_fill', 'turn_into'];

  function generate(tag, seed) {
    var g = GENS[tag] || GENS.past_form;
    var r = mulberry32(seed === undefined ? Math.floor(Math.random() * 1e9) : seed);
    var it = g.mk(r);
    it.tag = tag;
    it.id = 'g_' + tag + '_' + (seed === undefined ? Math.floor(Math.random() * 1e9) : seed);
    it.gen = true;
    return it;
  }

  function variants(item, n, seedBase) {
    var tag = item && item.tag && GENS[item.tag] ? item.tag : 'past_form';
    var base = seedBase === undefined ? hash(String(item && item.stem || '') + Date.now()) : seedBase;
    var out = [];
    for (var i = 0; i < (n || 3); i++) out.push(generate(tag, base + i * 7919 + 13));
    return out;
  }

  return {
    GENS: GENS, ORDER: ORDER, generate: generate, variants: variants,
    check: check, norm: norm, pastRule: pastRule, hash: hash, mulberry32: mulberry32
  };
})();

<script>
(function () {
  'use strict';
  var KEY = 'yl6a_var_v1';
  var view = document.getElementById('view');

  /* ---------- 单元 → 考点 ---------- */
  var UNIT_TAGS = {
    u1: ['continuous', 'verb_pattern', 'word_family', 'tense_signal'],
    u2: ['past_form', 'past_neg', 'past_yesno', 'be_past', 'whose', 'sva', 'transform_neg'],
    u3: ['wh_word', 'word_family', 'verb_pattern', 'plural', 'prep_time', 'transform_ask', 'phrase_fill'],
    u4: ['ordinal', 'prep_time', 'past_form'],
    u5: ['tense_signal', 'sva', 'verb_pattern'],
    u6: ['phrase_fill', 'verb_pattern', 'sva'],
    u7: ['turn_into', 'past_form', 'verb_pattern'],
    u8: ['past_form', 'be_past', 'tense_signal', 'word_family']
  };
  function unitOf(id) { for (var i = 0; i < UNITS.length; i++) if (UNITS[i].id === id) return UNITS[i]; return null; }
  function bankOf(u) { return BANK.filter(function (x) { return x.unit === u; }); }

  /* ---------- 存储 ---------- */
  var DB = (function () {
    try {
      var d = JSON.parse(localStorage.getItem(KEY) || '{}');
      return { tag: d.tag || {}, wrong: d.wrong || {}, day: d.day || {}, last: d.last || null };
    } catch (e) { return { tag: {}, wrong: {}, day: {}, last: null }; }
  })();
  function save() { try { localStorage.setItem(KEY, JSON.stringify(DB)); } catch (e) {} }
  function today() { var d = new Date(); return d.getFullYear() + '-' + (d.getMonth() + 1) + '-' + d.getDate(); }
  function record(tag, ok) {
    var t = DB.tag[tag] || (DB.tag[tag] = { n: 0, ok: 0 }); t.n++; if (ok) t.ok++;
    var k = today(); var d = DB.day[k] || (DB.day[k] = { n: 0, ok: 0 }); d.n++; if (ok) d.ok++;
    if (!ok) DB.wrong[tag] = (DB.wrong[tag] || 0) + 1;
    save();
  }
  function tagRate(tag) { var t = DB.tag[tag]; return t && t.n ? Math.round(t.ok / t.n * 100) : -1; }
  function totals() {
    var n = 0, ok = 0;
    for (var k in DB.tag) { n += DB.tag[k].n; ok += DB.tag[k].ok; }
    var d = DB.day[today()] || { n: 0, ok: 0 };
    return { n: n, ok: ok, rate: n ? Math.round(ok / n * 100) : 0, dn: d.n, drate: d.n ? Math.round(d.ok / d.n * 100) : 0 };
  }

  /* ---------- 工具 ---------- */
  function esc(s) { return String(s == null ? '' : s).replace(/&/g, '&amp;').replace(/</g, '&lt;').replace(/>/g, '&gt;').replace(/"/g, '&quot;'); }
  function letter(i) { return String.fromCharCode(65 + i); }
  function shuffle(a) { a = a.slice(); for (var i = a.length - 1; i > 0; i--) { var j = Math.floor(Math.random() * (i + 1)); var t = a[i]; a[i] = a[j]; a[j] = t; } return a; }
  function toast(m) {
    var d = document.createElement('div'); d.className = 'toast'; d.textContent = m;
    document.body.appendChild(d); setTimeout(function () { if (d.parentNode) d.parentNode.removeChild(d); }, 1600);
  }
  function speak(t) {
    try {
      if (!window.speechSynthesis) return;

      var u = new SpeechSynthesisUtterance(String(t)); u.lang = 'en-US'; u.rate = .85;
      speechSynthesis.speak(u);

  }

  /* ---------- 状态 ---------- */
  var S = { view: 'home', unit: null, tag: null, q: null, tab: 'all' };

  /* ---------- 首页 ---------- */
  function vHome() {
    var t = totals();
    document.getElementById('topStat').innerHTML =
      '今日 <b>' + t.dn + '</b> 题 · 正确率 <b>' + t.drate + '%</b>';
    var h = '';
    h += '<h2 class="sec">按单元练 · 生成同类变式</h2><div class="rows">';
    UNITS.forEach(function (U) {
      var tags = UNIT_TAGS[U.id] || [];

      tags.forEach(function (g) { var s = DB.tag[g]; if (s) { seen += s.n; okc += s.ok; } });
      var pct = seen ? Math.round(okc / seen * 100) : 0;
      h += '<button class="row" data-act="unit" data-id="' + U.id + '">' +
        '<span class="idx">' + U.no + '</span><span class="mid">' +
        '<span class="t">' + esc(U.title) + ' <span style="font-weight:400;font-size:12px;color:var(--ink3)">' + esc(U.cn) + '</span></span>' +
        '<span class="s">' + tags.length + ' 类考点' + (b.length ? ' · 真题 ' + b.length + ' 道' : '') + (seen ? ' · 已练 ' + seen + ' 题' : '') + '</span>' +
        (seen ? '<span class="meter"><i style="width:' + pct + '%"></i></span>' : '') +
        '</span><span class="arrow">›</span></button>';
    });
    h += '</div>';
    h += '<h2 class="sec">整卷与错题</h2><div class="rows">' +
      '<button class="row" data-act="exam"><span class="idx">▤</span><span class="mid"><span class="t">U2–U3 拔高卷（真题）</span>' +
      '<span class="s">' + BANK.filter(function (b) { return b.kind !== 'multi' && !b.ctx; }).length + ' 道原题：选择、适当形式、动词填空、句型转换、完成句子</span></span><span class="arrow">›</span></button>' +
      '<button class="row" data-act="errors"><span class="idx">✓</span><span class="mid"><span class="t">错得最多的考点</span>' +
      '<span class="s">' + (Object.keys(DB.wrong).length ? '按错误次数排，直接生成一组' : '还没有错题记录') + '</span></span><span class="arrow">›</span></button>' +
      '</div>';
    h += '<footer>变式题由 18 条语法模板现场生成，每题都带考点与解析；固定题来自《U2–U3 拔高测试卷》。<br>' +
      '记录只存本机浏览器；换设备用「讲评 → 导出」搬数据。</footer>';
    return h;
  }

  /* ---------- 单元页 ---------- */
  function vUnit(id) {
    var U = unitOf(id), tags = UNIT_TAGS[id] || [];
    var h = '<div style="display:flex;gap:12px;align-items:flex-start;margin:14px 0 4px">' +
      '<div style="font-family:var(--en);font-size:30px;line-height:1;color:var(--accent);font-weight:600">' + U.no + '</div>' +
      '<div><h2 style="margin:0;font-size:20px">' + esc(U.title) + '</h2>' +
      '<div style="font-size:13px;color:var(--ink3)">' + esc(U.cn) + ' · ' + esc(U.theme) + '</div></div></div>';
    h += '<div class="btnrow" style="margin:12px 0">' +
      '<button class="btn sm" data-act="mixed" data-id="' + id + '">本单元混合练（10 题）</button>' +
      '<button class="btn sm ghost" data-act="know" data-id="' + id + '">先看知识点</button></div>';
    h += '<h2 class="sec">选一个考点，只练这一类</h2><div class="rows">';
    tags.forEach(function (g) {
      var G = CORE.GENS[g]; if (!G) return;
      var r = tagRate(g);
      h += '<button class="row" data-act="tag" data-id="' + g + '" data-unit="' + id + '">' +
        '<span class="idx" style="font-size:12px">' + (r < 0 ? '·' : r + '%') + '</span>' +
        '<span class="mid"><span class="t">' + esc(G.label) + '</span><span class="s">' + esc(G.desc) + '</span></span>' +
        '<span class="arrow">›</span></button>';
    });
    h += '</div>';
    h += '<p style="font-size:12px;color:var(--ink3);margin-top:10px">点进去先选题数（5 / 10 / 20），做错可以「再来一道同考点」一直练到对。</p>';
    return h;
  }

  /* ---------- 知识点页 ---------- */
  function vKnow(id) {
    var U = unitOf(id || 'u2'), tags = UNIT_TAGS[U.id] || [];
    var h = '<div class="chips">' + UNITS.map(function (x) {
      return '<button class="chip' + (x.id === U.id ? ' on' : '') + '" data-act="know" data-id="' + x.id + '">' + x.no + ' ' + esc(x.title) + '</button>';
    }).join('') + '</div>';
    h += '<h2 class="sec">' + U.no + ' 的核心语法（' + tags.length + ' 类）</h2>';
    tags.forEach(function (g) {
      var K = TAG_KNOW[g], G = CORE.GENS[g];
      if (!K) return;
      h += '<div class="panel"><h3 style="margin:0 0 6px;font-size:15px">' + esc(K.t) + '</h3>' +
        '<div style="font-family:var(--en);font-size:15px;color:var(--accent)">' + esc(K.f) + '</div>' +
        '<div style="font-family:var(--en);font-size:14px;color:var(--ink);margin-top:6px">' + esc(K.e) + '</div>' +
        '<div style="background:var(--gold-soft);border:1px solid #E8D6B4;border-radius:9px;padding:9px 11px;margin-top:9px;font-size:13px;color:#6B4A16">' + esc(K.w) + '</div>' +
        (G ? '<div class="btnrow" style="margin-top:9px"><button class="btn sm ghost" data-act="tag" data-id="' + g + '" data-unit="' + U.id + '">只练这一类</button></div>' : '') +
        '</div>';
    });
    return h;
  }

  /* ---------- 选题数 ---------- */
  function vCount(unit, tag) {
    var G = CORE.GENS[tag];
    var h = '<div style="margin-top:16px">' +
      '<div style="font-size:12px;color:var(--ink3)">' + (unit ? unitOf(unit).no + ' · ' : '') + '</div>' +
      '<h2 style="margin:4px 0 6px;font-size:20px">' + esc(G.label) + '</h2>' +
      '<div style="font-size:13.5px;color:var(--ink2)">' + esc(G.desc) + '</div>';
    var K = TAG_KNOW[tag];
    if (K) h += '<div class="know open" style="margin-top:12px"><div class="kh"><span>' + esc(K.t) + '</span><span style="font-weight:400">考点</span></div>' +
      '<div class="kb"><span class="f">' + esc(K.f) + '</span><span class="e">' + esc(K.e) + '</span>' + esc(K.w) + '</div></div>';
    h += '<h2 class="sec">这组做几道？</h2><div class="btnrow">' +
      '<button class="btn" data-act="start" data-tag="' + tag + '" data-n="5">5 题</button>' +
      '<button class="btn" data-act="start" data-tag="' + tag + '" data-n="10">10 题</button>' +
      '<button class="btn ghost" data-act="start" data-tag="' + tag + '" data-n="20">20 题</button></div>';
    h += '<p style="font-size:12px;color:var(--ink3);margin-top:12px">同一个考点，每次的题干、主语、时间、动词都不一样——练的是规则，不是背题。</p></div>';
    return h;
  }

  /* ---------- 答题 ---------- */
  function vQuiz() {
    var q = S.q, it = q.items[q.i];
    if (!it) return vResult();
    var h = '<div class="qbar"><i style="width:' + Math.round(q.i / q.items.length * 100) + '%"></i></div>';
    h += '<div class="qmeta"><span>第 ' + (q.i + 1) + '/' + q.items.length + ' 题 · ' + esc(q.title) + '</span>' +
      '<span class="tag">' + esc(it.tagLabel || '') + '</span></div>';
    h += '<div class="stem">' + fmt(it.stem) + '</div>';
    if (it.kind === 'choice') {
      h += '<div class="opts">';
      it.options.forEach(function (o, i) {
        var cls = 'opt';
        if (q.submitted) { if (letter(i) === it.answer) cls += ' ok'; else if (q.pick === letter(i)) cls += ' bad'; }
        else if (q.pick === letter(i)) cls += ' sel';
        h += '<button class="' + cls + '" data-act="pick" data-id="' + letter(i) + '"' + (q.submitted ? ' disabled' : '') + '>' +
          '<span class="lt">' + letter(i) + '</span><span class="tx">' + esc(o) + '</span></button>';
      });
      h += '</div>';
    } else if (it.kind === 'text') {
      h += '<div class="field"><textarea id="ansInput" placeholder="写出完整句子" ' + (q.submitted ? 'disabled' : '') + '>' + esc(q.input) + '</textarea>' +
        '<div class="hint">大小写、句末标点不严格扣分；didn\'t 与 did not 都算对。</div></div>';
    } else {
      h += '<div class="field"><input id="ansInput" autocomplete="off" autocapitalize="off" spellcheck="false" placeholder="填横线上的内容" value="' + esc(q.input) + '" ' + (q.submitted ? 'disabled' : '') + '>' +
        '<div class="hint">多个空用分号隔开，如 inventor; inventions。</div></div>';
    }
    if (!q.submitted) h += '<div class="btnrow" style="margin-top:16px"><button class="btn block" data-act="submit">提交</button></div>';
    else h += vFb(it, q.ok);
    return h;
  }

  function fmt(s) {
    var p = String(s).split('\n'), o = esc(p[0]);
    for (var i = 1; i < p.length; i++) o += '<span class="cn">' + esc(p[i]) + '</span>';
    return o;
  }

  function vFb(it, ok) {
    var K = TAG_KNOW[it.tag] || null;
    var h = '<div class="fb ' + (ok ? 'ok' : 'bad') + '"><div class="h"><span>' + (ok ? '✓ 正确' : '✗ 再看一步') + '</span>' +
      '<span style="font-weight:400;font-size:11.5px">' + esc(it.point || '') + '</span></div><div class="b">';
    if (!ok) h += '<div class="kv"><div class="k">答案</div><div class="v en">' + esc(it.kind === 'choice' ? it.answer + '. ' + it.options[it.answer.charCodeAt(0) - 65] : it.answer) + '</div></div>';
    h += '<div class="kv"><div class="k">为什么</div><div class="v">' + esc(it.why) + '</div></div>';
    if (K) h += '<div class="know' + (ok ? '' : ' open') + '"><div class="kh" data-act="fold"><span>' + esc(K.t) + '</span><span style="font-weight:400">展开公式</span></div>' +
      '<div class="kb"><span class="f">' + esc(K.f) + '</span><span class="e">' + esc(K.e) + '</span>' + esc(K.w) + '</div></div>';
    h += '<div class="acts">';
    if (it.tag) h += '<button class="btn sm ghost" data-act="again-tag">再来一道同考点</button>';
    h += '<button class="btn sm" data-act="next">' + (S.q.i + 1 >= S.q.items.length ? '看结果' : '下一题') + '</button>';
    h += '</div></div></div>';
    return h;
  }

  function vResult() {
    var q = S.q, n = q.res.length, ok = q.res.filter(Boolean).length;
    var pct = n ? Math.round(ok / n * 100) : 0;
    var bad = {};
    q.items.forEach(function (it, i) { if (q.res[i] === false) bad[it.tag] = (bad[it.tag] || 0) + 1; });
    var h = '<div class="panel res"><div style="font-size:12px;color:var(--ink3);letter-spacing:.1em">' + esc(q.title) + '</div>' +
      '<div class="big">' + ok + ' / ' + n + '</div><div class="sub">正确率 ' + pct + '%' +
      (pct >= 90 ? ' · 这一组可以过了' : pct >= 70 ? ' · 错的考点再练一组' : ' · 先看知识点，再来') + '</div></div>';
    var keys = Object.keys(bad);
    if (keys.length) {
      h += '<h2 class="sec">错的考点（点一下只练这一类）</h2><div class="taglist">';
      keys.forEach(function (g) {
        h += '<button class="tg bad" data-act="tag" data-id="' + g + '">' + esc(CORE.GENS[g] ? CORE.GENS[g].label : g) + ' ×' + bad[g] + '</button>';
      });
      h += '</div>';
    }
    h += '<div class="btnrow" style="margin-top:16px">' +
      (keys.length ? '<button class="btn" data-act="drill-wrong">只练错的考点</button>' : '') +
      '<button class="btn ghost" data-act="repeat">再来一组</button>' +
      '<button class="btn ghost" data-act="home">回首页</button></div>';
    return h;
  }

  /* ---------- 组卷 ---------- */
  function buildTags(tags, n) {
    var items = [];
    for (var i = 0; i < n; i++) {
      var g = tags[i % tags.length];
      var it = CORE.generate(g, Math.floor(Math.random() * 1e9));
      it.tagLabel = CORE.GENS[g].label;
      items.push(it);
    }
    return shuffle(items);
  }
  function startQuiz(items, title, key) {
    if (!items.length) { toast('没有可用题目'); return; }
    S.q = { items: items, i: 0, pick: null, input: '', submitted: false, ok: null, res: [], title: title, key: key || '' };
    S.view = 'quiz'; render(); window.scrollTo(0, 0);
  }

  /* ---------- 错题 ---------- */
  function vErrors() {
    var arr = Object.keys(DB.wrong).map(function (g) { return { g: g, n: DB.wrong[g] }; }).sort(function (a, b) { return b.n - a.n; });
    var h = '<div style="margin-top:14px"><h2 style="margin:0;font-size:20px">错题（按考点）</h2>' +
      '<div style="font-size:13px;color:var(--ink3);margin-top:3px">每错一题记一次；点考点直接生成一组同类变式</div></div>';
    if (!arr.length) return h + '<div class="empty"><div style="font-size:28px;color:var(--line2);font-family:var(--en)">空</div><p>还没有错题记录。</p></div>';
    h += '<div class="btnrow" style="margin:12px 0"><button class="btn sm" data-act="drill-wrong">练错的考点（10 题）</button>' +
      '<button class="btn sm ghost" data-act="print">打印</button></div><div class="rows">';
    arr.forEach(function (o) {
      var G = CORE.GENS[o.g]; var r = tagRate(o.g);
      h += '<button class="row" data-act="tag" data-id="' + o.g + '"><span class="idx" style="font-size:12px">' + (r < 0 ? '·' : r + '%') + '</span>' +
        '<span class="mid"><span class="t">' + esc(G ? G.label : o.g) + '</span><span class="s">错 ' + o.n + ' 次' + (G ? ' · ' + esc(G.desc) : '') + '</span></span>' +
        '<span class="arrow">›</span></button>';
    });
    h += '</div>';
    return h;
  }

  /* ---------- 讲评 ---------- */
  function vTeach() {
    var t = totals();
    var rows = CORE.ORDER.map(function (g) {
      var s = DB.tag[g]; if (!s) return null;
      return { g: g, n: s.n, pct: Math.round(s.ok / s.n * 100) };
    }).filter(Boolean).sort(function (a, b) { return a.pct - b.pct; });
    var h = '<div style="margin-top:14px"><h2 style="margin:0;font-size:20px">讲评台</h2>' +
      '<div style="font-size:13px;color:var(--ink3);margin-top:3px">先看数据 → 再讲错因 → 变式再练</div></div>';
    h += '<div class="panel" style="margin-top:12px;display:grid;grid-template-columns:repeat(3,1fr);text-align:center">' +
      '<div><div style="font-size:11.5px;color:var(--ink3)">累计</div><div style="font-family:var(--en);font-size:22px">' + t.n + '</div></div>' +
      '<div><div style="font-size:11.5px;color:var(--ink3)">正确率</div><div style="font-family:var(--en);font-size:22px">' + t.rate + '%</div></div>' +
      '<div><div style="font-size:11.5px;color:var(--ink3)">考点数</div><div style="font-family:var(--en);font-size:22px">' + Object.keys(DB.tag).length + '</div></div></div>';
    h += '<h2 class="sec">各考点正确率（最弱在最上）</h2>';
    if (!rows.length) h += '<div class="panel" style="font-size:13.5px;color:var(--ink3)">还没有练习记录。做一组题后，这里会自动按考点排序。</div>';
    else {
      h += '<div class="panel">';
      rows.forEach(function (o) {
        var G = CORE.GENS[o.g];
        h += '<div style="padding:8px 0;border-bottom:1px dashed var(--line)">' +
          '<div style="display:flex;justify-content:space-between;font-size:14px"><span>' + esc(G ? G.label : o.g) + '</span>' +
          '<span style="font-family:var(--en);color:' + (o.pct < 60 ? 'var(--bad)' : 'var(--accent)') + '">' + o.pct + '% <span style="font-size:11px;color:var(--ink3)">(' + o.n + ')</span></span></div>' +
          '<div class="meter" style="margin-top:5px"><i style="width:' + o.pct + '%' + (o.pct < 60 ? ';background:var(--bad)' : '') + '"></i></div></div>';
      });
      h += '</div>';
    }
    h += '<h2 class="sec">三步讲评（1 课时）</h2><div class="panel">' +
      '<div style="padding:8px 0;border-bottom:1px dashed var(--line)"><b>1 · 数据（5 分钟）</b><div style="font-size:13.5px;color:var(--ink2)">看上面最弱两项，通常是「动词搭配」和「不规则动词」。</div></div>' +
      '<div style="padding:8px 0;border-bottom:1px dashed var(--line)"><b>2 · 归因（20 分钟）</b><div style="font-size:13.5px;color:var(--ink2)">每道错题只问三句：考什么？凭什么判断？错在哪一步？</div></div>' +
      '<div style="padding:8px 0"><b>3 · 变式（15 分钟）</b><div style="font-size:13.5px;color:var(--ink2)">同一考点连做 10 道变式，换主语、换时间、换动词——会一类，而不是会一题。</div></div></div>';
    h += '<h2 class="sec">数据</h2><div class="rows">' +
      '<button class="row" data-act="export"><span class="idx">↓</span><span class="mid"><span class="t">导出记录</span><span class="s">JSON，换设备或给老师</span></span><span class="arrow">›</span></button>' +
      '<button class="row" data-act="wipe"><span class="idx">×</span><span class="mid"><span class="t">清空本机记录</span><span class="s">只删这台设备</span></span><span class="arrow">›</span></button></div>';
    return h;
  }

  /* ---------- 渲染 ---------- */
  function render() {
    var h;
    if (S.view === 'home') h = vHome();
    else if (S.view === 'unit') h = vUnit(S.unit);
    else if (S.view === 'know') h = vKnow(S.unit);
    else if (S.view === 'count') h = vCount(S.unit, S.tag);
    else if (S.view === 'quiz') h = vQuiz();
    else if (S.view === 'errors') h = vErrors();
    else if (S.view === 'teach') h = vTeach();
    else if (S.view === 'map') h = vMap();
    else h = vHome();
    document.getElementById('view').innerHTML = h;
    var cur = { home: 'home', unit: 'home', know: 'map', count: 'home', quiz: 'home', errors: 'errors', teach: 'teach', map: 'map' }[S.view] || 'home';
    Array.prototype.forEach.call(document.querySelectorAll('nav button'), function (b) {
      b.setAttribute('aria-current', b.getAttribute('data-nav') === cur ? 'true' : 'false');
    });
    var el = document.getElementById('ansInput');
    if (S.view === 'quiz' && el && !S.q.submitted) el.focus({ preventScroll: true });
  }

  function vMap() {
    var h = '<div style="margin-top:14px"><h2 style="margin:0;font-size:20px">18 类考点</h2>' +
      '<div style="font-size:13px;color:var(--ink3);margin-top:3px">点任意一类，直接生成一组；也可以从单元页进</div></div><div class="rows" style="margin-top:12px">';
    CORE.ORDER.forEach(function (g) {
      var G = CORE.GENS[g], r = tagRate(g);
      h += '<button class="row" data-act="tag" data-id="' + g + '"><span class="idx" style="font-size:12px">' + (r < 0 ? '·' : r + '%') + '</span>' +
        '<span class="mid"><span class="t">' + esc(G.label) + '</span><span class="s">' + esc(G.desc) + '</span></span><span class="arrow">›</span></button>';
    });
    h += '</div>';
    return h;
  }

  /* ---------- 提交 ---------- */
  function submit() {
    var q = S.q, it = q.items[q.i];
    if (q.submitted) return;
    var ok;
    if (it.kind === 'choice') {
      if (!q.pick) { toast('先选一个'); return; }
      ok = CORE.check(it, q.pick);
    } else {
      var el = document.getElementById('ansInput');
      q.input = el ? el.value : '';
      if (!String(q.input).trim()) { toast('先写下答案'); return; }
      ok = CORE.check(it, q.input);
    }
    q.ok = ok; q.submitted = true; q.res[q.i] = ok;
    record(it.tag, ok);
    render();
    var fb = document.querySelector('.fb');
    if (fb) fb.scrollIntoView({ block: 'nearest', behavior: 'smooth' });
  }

  function next() {
    var q = S.q;
    if (q.i + 1 >= q.items.length) { q.i = q.items.length; render(); window.scrollTo(0, 0); return; }
    q.i++; q.pick = null; q.input = ''; q.submitted = false; q.ok = null;
    render(); window.scrollTo(0, 0);
  }

  function againTag() {
    var q = S.q, it = q.items[q.i];
    var n = CORE.generate(it.tag, Math.floor(Math.random() * 1e9));
    n.tagLabel = CORE.GENS[it.tag].label;
    q.items[q.i] = n;
    q.pick = null; q.input = ''; q.submitted = false; q.ok = null;
    render(); toast('换了一道同类题');
  }

  /* ---------- 事件 ---------- */
  document.addEventListener('click', function (e) {
    var el = e.target.closest('[data-act]');
    if (!el) return;
    var act = el.getAttribute('data-act'), id = el.getAttribute('data-id');
    if (act === 'home') { S.view = 'home'; render(); window.scrollTo(0, 0); }
    else if (act === 'unit') { S.unit = id; S.view = 'unit'; render(); window.scrollTo(0, 0); }
    else if (act === 'know') { S.unit = id; S.view = 'know'; render(); window.scrollTo(0, 0); }
    else if (act === 'tag') { S.unit = el.getAttribute('data-unit') || S.unit; S.tag = id; S.view = 'count'; render(); window.scrollTo(0, 0); }
    else if (act === 'start') {
      var n = parseInt(el.getAttribute('data-n'), 10);
      startQuiz(buildTags([S.tag], n), CORE.GENS[S.tag].label, 'tag:' + S.tag);
    }
    else if (act === 'mixed') {
      var tags = UNIT_TAGS[id] || CORE.ORDER.slice(0, 4);
      startQuiz(buildTags(tags, 10), unitOf(id).no + ' 混合', 'unit:' + id);
    }
    else if (act === 'exam') {
      var items = BANK.filter(function (b) { return b.kind !== 'multi' && !b.ctx; }).map(function (b) {
        if (b.kind === 'choice') return { kind: 'choice', stem: b.stem, options: b.options, answer: b.answer, point: b.point, why: b.why, tag: b.tag, tagLabel: TAG_KNOW[b.tag] ? TAG_KNOW[b.tag].t : '真题' };
        return { kind: b.kind === 'text' ? 'text' : 'fill', stem: b.stem, answer: b.answer, accept: b.accept, point: b.point, why: b.why, tag: b.tag, tagLabel: TAG_KNOW[b.tag] ? TAG_KNOW[b.tag].t : '真题' };
      });
      startQuiz(shuffle(items), 'U2–U3 拔高卷 · 真题', 'exam');
    }
    else if (act === 'pick') { if (!S.q.submitted) { S.q.pick = id; render(); } }
    else if (act === 'submit') submit();
    else if (act === 'next') next();
    else if (act === 'again-tag') againTag();
    else if (act === 'fold') { var k = el.parentNode; k.classList.toggle('open'); }
    else if (act === 'drill-wrong') {
      var gs = Object.keys(DB.wrong).sort(function (a, b) { return DB.wrong[b] - DB.wrong[a]; }).slice(0, 4);
      if (!gs.length) { toast('还没有错题'); return; }
      startQuiz(buildTags(gs, 10), '只练错的考点', 'drill');
    }
    else if (act === 'repeat') {
      var key = S.q && S.q.key || '';
      if (key.indexOf('tag:') === 0) { var t = key.slice(4); startQuiz(buildTags([t], S.q.items.length), S.q.title, key); }
      else if (key.indexOf('unit:') === 0) { var u = key.slice(5); startQuiz(buildTags(UNIT_TAGS[u], 10), S.q.title, key); }
      else if (key === 'exam') { S.view = 'home'; render(); }
      else { S.view = 'home'; render(); }
    }
    else if (act === 'errors') { S.view = 'errors'; render(); window.scrollTo(0, 0); }
    else if (act === 'teach') { S.view = 'teach'; render(); window.scrollTo(0, 0); }
    else if (act === 'map') { S.view = 'map'; render(); window.scrollTo(0, 0); }
    else if (act === 'print') window.print();
    else if (act === 'export') {
      var blob = new Blob([JSON.stringify({ app: 'yl6a_var', ts: Date.now(), db: DB }, null, 1)], { type: 'application/json' });
      var a = document.createElement('a'); var d = new Date();
      a.href = URL.createObjectURL(blob);
      a.download = '变式练习记录_' + d.getFullYear() + ('0' + (d.getMonth() + 1)).slice(-2) + ('0' + d.getDate()).slice(-2) + '.json';
      document.body.appendChild(a); a.click();
      setTimeout(function () { URL.revokeObjectURL(a.href); a.remove(); }, 400);
      toast('已导出');
    }
    else if (act === 'wipe') {
      if (!DB || !Object.keys(DB.tag).length) { toast('没有记录'); return; }
      DB = { tag: {}, wrong: {}, day: {}, last: null }; save(); S.view = 'home'; render(); toast('已清空');
    }
  });

  document.getElementById('nav').addEventListener('click', function (e) {
    var b = e.target.closest('[data-nav]'); if (!b) return;
    var n = b.getAttribute('data-nav');
    S.view = n; render(); window.scrollTo(0, 0);
  });

  document.addEventListener('keydown', function (e) {
    if (e.key !== 'Enter') return;
    if (S.view !== 'quiz' || !S.q || !S.q.items[S.q.i]) return;
    if (e.target && e.target.tagName === 'TEXTAREA') return;
    e.preventDefault();
    if (S.q.submitted) next(); else submit();
  });

  document.addEventListener('input', function (e) {
    if (e.target && e.target.id === 'ansInput' && S.q) S.q.input = e.target.value;
  });

  window.__APP = { S: S, render: render, CORE: CORE, startQuiz: startQuiz };
  render();
})();
</script>
</body>
</html>
